services:

  nginx:
    image: nginx:alpine
    container_name: cyangame-nginx
    restart: unless-stopped
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - mediamtx
    networks:
      - cyangame

  backend:
    build: ./backend
    container_name: cyangame-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/cyangame.db
      - ENV_FILE=/data/.env
      - MEDIAMTX_API=http://cyangame-mediamtx:9997
      - EMULATION_API=http://cyangame-emulation:7002
      - NODE_AGENT_PORT=7001
      - SRT_PORT=8890
      - MEDIAMTX_HOST=cyangame-mediamtx
    volumes:
      - /mnt/user/appdata/cyangame/data:/data
      - /mnt/user/roms:/roms:ro
    depends_on:
      - mediamtx
    networks:
      - cyangame

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cyangame-mediamtx
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "8890:8890/udp"
      - "9997:9997"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - cyangame

  coturn:
    image: coturn/coturn:alpine
    container_name: cyangame-coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n --realm=cyangame --fingerprint --lt-cred-mech
      --user=cyangame:cyangame123 --no-stdout-log

  emulation:
    build: ../retroarch
    container_name: cyangame-emulation
    restart: unless-stopped
    environment:
      - MEDIAMTX_HOST=cyangame-mediamtx
      - SRT_PORT=8890
    volumes:
      - /mnt/user/roms:/roms:ro
      - /mnt/user/appdata/cyangame/saves:/saves
      - /mnt/user/appdata/cyangame/bios:/bios:ro
    ports:
      - "7002:7002"
    networks:
      - cyangame
    # Uncomment for Intel iGPU encode acceleration:
    # devices:
    #   - /dev/dri:/dev/dri

networks:
  cyangame:
    name: cyangame
    driver: bridge
