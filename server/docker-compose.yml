version: "3.8"

# ════════════════════════════════════════════════════════
#  CyanGame — Unraid Server Stack
#
#  Setup: open http://YOUR_UNRAID_IP:7000/setup
#  The wizard configures everything — no .env editing needed.
#
#  On Unraid:
#    cd /mnt/user/appdata/cyangame/server
#    docker compose up -d
# ════════════════════════════════════════════════════════

services:

  nginx:
    image: nginx:alpine
    container_name: cyangame-nginx
    restart: unless-stopped
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - mediamtx
    networks:
      - cyangame

  backend:
    build: ./backend
    image: cyangame-backend:latest
    container_name: cyangame-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/cyangame.db
      - ENV_FILE=/data/.env
      - MEDIAMTX_API=http://cyangame-mediamtx:9997
      - NODE_AGENT_PORT=7001
      - SRT_PORT=8890
    volumes:
      - /mnt/user/appdata/cyangame/data:/data
      - /mnt/user/roms:/roms:ro          # adjust if your ROMs are elsewhere
    depends_on:
      - mediamtx
    networks:
      - cyangame

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cyangame-mediamtx
    restart: unless-stopped
    ports:
      - "8889:8889"      # WebRTC — browsers pull here
      - "8890:8890/udp"  # SRT    — nodes push here
      - "8554:8554"      # RTSP   (internal)
      - "9997:9997"      # API    (internal)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - cyangame

  coturn:
    image: coturn/coturn:alpine
    container_name: cyangame-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    # Turn password is set by the setup wizard and written to /data/.env
    # Coturn reads it via the command below — update after running wizard
    command: >
      -n --realm=cyangame --fingerprint --lt-cred-mech
      --user=cyangame:changeme --no-stdout-log
    networks:
      - cyangame

  emulation:
    build:
      context: ../../retroarch
      dockerfile: Dockerfile
    image: cyangame-emulation:latest
    container_name: cyangame-emulation
    restart: unless-stopped
    environment:
      - DISPLAY=:99
      - MEDIAMTX_HOST=cyangame-mediamtx
      - SRT_PORT=8890
    volumes:
      - /mnt/user/roms:/roms:ro
      - /mnt/user/appdata/cyangame/saves:/saves
      - /mnt/user/appdata/cyangame/emulator-config:/config
    # Uncomment for NVIDIA GPU (requires Unraid Nvidia plugin):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Uncomment for Intel iGPU:
    # devices:
    #   - /dev/dri:/dev/dri
    depends_on:
      - mediamtx
    networks:
      - cyangame

networks:
  cyangame:
    name: cyangame
    driver: bridge
