<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyanGame</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#05080F;--bg2:#090E1A;--bg3:#0F1728;--card:#0C1422;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --cyan:#22D3EE;--purple:#A855F7;--green:#10B981;--red:#EF4444;
  --text:#E2E8F0;--muted:#475569;
  --font:'Chakra Petch',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;
  padding:9px 12px;font-family:var(--font);font-size:13px;color:var(--text);outline:none;
  width:100%;transition:border .15s;}
input:focus,select:focus{border-color:rgba(34,211,238,.4);}
select option{background:var(--bg3);}
button{cursor:pointer;border:none;font-family:var(--font);}
label{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;display:block;margin-bottom:5px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const api = (path, opts={}) =>
  fetch('/api' + path, {
    headers: {'Content-Type':'application/json'}, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.error || 'Error')));

const SYS = {
  nes:{name:'NES',color:'#e60012'}, snes:{name:'SNES',color:'#7B2FBE'},
  gb:{name:'Game Boy',color:'#7B35A0'}, gbc:{name:'GBC',color:'#7B35A0'},
  gba:{name:'GBA',color:'#7B35A0'}, n64:{name:'N64',color:'#009AC7'},
  genesis:{name:'Genesis',color:'#1A6DD1'}, ps1:{name:'PlayStation',color:'#003087'},
  ps2:{name:'PS2',color:'#00439C'}, gamecube:{name:'GameCube',color:'#6A35BE'},
  wii:{name:'Wii',color:'#8E8E8E'}, nds:{name:'DS',color:'#CC2200'},
  switch:{name:'Switch',color:'#E4000F'}, ps3:{name:'PS3',color:'#003791'},
};

let _tid = 0;
function useToast() {
  const [toasts, set] = useState([]);
  const add = (msg, type='info') => {
    const id = ++_tid;
    set(t => [...t, {id,msg,type}]);
    setTimeout(() => set(t => t.filter(x => x.id !== id)), 3200);
  };
  return { toasts, toast: add };
}

function Dot({ status }) {
  const cls = status === 'live' ? 'live' : status === 'on' ? 'on' : 'off';
  return <span style={{
    display:'inline-block', width:7, height:7, borderRadius:'50%', flexShrink:0,
    background: cls==='live'?'var(--cyan)':cls==='on'?'var(--green)':'var(--red)',
    boxShadow: cls==='live'?'0 0 6px var(--cyan)':cls==='on'?'0 0 6px var(--green)':'none',
    animation: cls!=='off' ? 'pulse 2s infinite' : 'none',
  }}/>;
}

function Spinner() {
  return <span style={{
    display:'inline-block',width:13,height:13,border:'2px solid rgba(255,255,255,.2)',
    borderTopColor:'var(--cyan)',borderRadius:'50%',animation:'spin .65s linear infinite',
    flexShrink:0,
  }}/>;
}

function RomCard({ rom, inSession, onPlay }) {
  const s = SYS[rom.system] || { name: rom.system, color:'#333' };
  const sz = rom.file_size > 1e9 ? `${(rom.file_size/1e9).toFixed(1)}GB`
           : rom.file_size > 1e6 ? `${(rom.file_size/1e6).toFixed(0)}MB` : '';
  return (
    <div onClick={() => onPlay(rom)} style={{
      background:'var(--card)', border:'1px solid var(--border)', borderRadius:10,
      overflow:'hidden', cursor:'pointer', transition:'all .18s', position:'relative',
    }}
    onMouseEnter={e => { e.currentTarget.style.transform='translateY(-3px)'; e.currentTarget.style.boxShadow='0 14px 36px rgba(0,0,0,.55)'; e.currentTarget.style.borderColor='rgba(255,255,255,.13)'; }}
    onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; e.currentTarget.style.borderColor='rgba(255,255,255,.07)'; }}>
      <div style={{height:115, display:'flex', alignItems:'center', justifyContent:'center',
        background:`linear-gradient(135deg,${s.color},${s.color}55)`, position:'relative', overflow:'hidden'}}>
        {rom.cover_url
          ? <img src={rom.cover_url} alt={rom.title} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          : <div style={{fontSize:12,fontWeight:700,color:'rgba(255,255,255,.85)',textAlign:'center',padding:10}}>
              {rom.title.split(':')[0]}
            </div>}
        <div style={{position:'absolute',top:7,left:7,fontSize:9,fontWeight:700,fontFamily:'var(--mono)',
          background:'rgba(168,85,247,.85)',color:'#fff',padding:'2px 6px',borderRadius:3}}>
          {s.name.toUpperCase()}
        </div>
        {inSession && <div style={{position:'absolute',top:7,right:7,fontSize:9,fontWeight:700,
          fontFamily:'var(--mono)',background:'var(--red)',color:'#fff',padding:'2px 6px',borderRadius:3}}>LIVE</div>}
      </div>
      <div style={{padding:'9px 11px'}}>
        <div style={{fontSize:12,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',marginBottom:3}}>
          {rom.title}
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:10,fontFamily:'var(--mono)',color:s.color}}>{s.name}</span>
          {sz && <span style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--muted)'}}>{sz}</span>}
        </div>
      </div>
    </div>
  );
}

function PlayModal({ rom, inSession, onLaunch, onClose }) {
  const s = SYS[rom.system] || { name:rom.system, color:'#1e293b' };
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const launch = async () => {
    setLoading(true); setErr(null);
    try { await onLaunch(rom); }
    catch(e) { setErr(String(e)); setLoading(false); }
  };
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:200,
      display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(5px)'}}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border2)',borderRadius:16,
        width:460,maxWidth:'95vw',maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{height:160,display:'flex',alignItems:'flex-end',padding:18,position:'relative',overflow:'hidden',
          background:`linear-gradient(145deg,${s.color},${s.color}44)`}}>
          {rom.cover_url && <img src={rom.cover_url} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:.25}}/>}
          <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 60%)'}}/>
          <div style={{fontSize:20,fontWeight:700,textShadow:'0 2px 10px rgba(0,0,0,.8)',position:'relative',zIndex:1}}>
            {rom.title}
          </div>
        </div>
        <div style={{padding:22}}>
          {err && <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',
            borderRadius:9,padding:'12px 14px',fontSize:12,fontFamily:'var(--mono)',
            color:'var(--red)',marginBottom:14}}>✗ {err}</div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:16}}>
            {[
              ['System', s.name, s.color],
              ['Mode', '⚙ Server Emulation', 'var(--purple)'],
            ].map(([l,v,c]) => (
              <div key={l} style={{background:'var(--bg3)',borderRadius:8,padding:'10px 12px'}}>
                <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>{l}</div>
                <div style={{fontSize:13,fontWeight:500,color:c||'var(--text)'}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{background:'rgba(34,211,238,.06)',border:'1px solid rgba(34,211,238,.15)',
            borderRadius:9,padding:'12px 14px',fontSize:12,fontFamily:'var(--mono)',
            color:'var(--cyan)',marginBottom:16,lineHeight:1.6}}>
            Emulator runs on your NAS and streams via WebRTC. First launch takes 5–15 seconds.
          </div>
          <div style={{display:'flex',gap:9}}>
            <button onClick={onClose} style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',
              color:'var(--muted)',borderRadius:8,padding:'10px 0',fontSize:12,fontWeight:600,
              letterSpacing:'.05em',textTransform:'uppercase',display:'flex',alignItems:'center',justifyContent:'center',gap:7}}>
              Cancel
            </button>
            <button onClick={launch} disabled={loading} style={{flex:2,background:'var(--purple)',color:'#fff',
              borderRadius:8,padding:'10px 0',fontSize:12,fontWeight:600,letterSpacing:'.05em',
              textTransform:'uppercase',display:'flex',alignItems:'center',justifyContent:'center',gap:7,
              opacity:loading?0.7:1}}>
              {loading ? <><Spinner/>Launching…</> : '⚙ Start Emulation'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function StreamViewer({ rom, session, onStop, onClose }) {
  const [t, setT] = useState(0);
  const vref = useRef(null);
  const s = SYS[rom.system] || { name:rom.system, color:'#333' };

  useEffect(() => { const x = setInterval(()=>setT(n=>n+1),1000); return()=>clearInterval(x); },[]);

  useEffect(() => {
    if (!session?.streamUrl || !vref.current) return;
    const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.addTransceiver('video',{direction:'recvonly'});
    pc.addTransceiver('audio',{direction:'recvonly'});
    pc.ontrack = e => { if(vref.current) vref.current.srcObject = e.streams[0]; };
    (async()=>{
      const o = await pc.createOffer();
      await pc.setLocalDescription(o);
      try {
        const r = await fetch(session.streamUrl,{method:'POST',headers:{'Content-Type':'application/sdp'},body:o.sdp});
        if(r.ok) await pc.setRemoteDescription({type:'answer',sdp:await r.text()});
      } catch(e){console.warn('WHEP:',e);}
    })();
    return()=>pc.close();
  },[session]);

  const fmt = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;

  return (
    <div style={{position:'fixed',inset:0,background:'#000',zIndex:300,display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
        <video ref={vref} autoPlay playsInline style={{width:'100%',height:'100%',objectFit:'contain',display:'block'}}/>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
          pointerEvents:'none',opacity:0.35}}>
          <div style={{textAlign:'center',color:'var(--muted)'}}>
            <div style={{fontSize:36,marginBottom:8}}>⚙</div>
            <div style={{fontSize:11,fontFamily:'var(--mono)'}}>{session?.streamPath||'Connecting…'}</div>
          </div>
        </div>
      </div>
      <div style={{padding:'11px 18px',borderTop:'1px solid var(--border)',
        display:'flex',alignItems:'center',gap:12,background:'var(--bg)'}}>
        <span style={{fontSize:11,fontFamily:'var(--mono)',color:s.color,fontWeight:600}}>{s.name}</span>
        <span style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--purple)'}}>Server Emulation</span>
        <span style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{rom.title}</span>
        <span style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)',marginLeft:'auto'}}>{fmt(t)}</span>
        <button onClick={async()=>{await onStop();onClose();}} style={{
          background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',color:'var(--red)',
          borderRadius:7,padding:'6px 12px',fontSize:11,fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase'}}>
          ■ End Session
        </button>
      </div>
    </div>
  );
}

function SetupView({ onDone }) {
  const [nasIp, setNasIp] = useState('');
  const [romPath, setRomPath] = useState('/mnt/user/roms');
  const [saving, setSaving] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanResult, setScan] = useState(null);
  const [err, setErr] = useState(null);
  const { toast } = useToast();

  useEffect(()=>{
    api('/setup/detect-ip').then(r=>{if(r.primary)setNasIp(r.primary);}).catch(()=>{});
    api('/setup/env').then(r=>{if(r.nasIp)setNasIp(r.nasIp);if(r.romPath)setRomPath(r.romPath);}).catch(()=>{});
  },[]);

  const save = async()=>{
    setSaving(true); setErr(null);
    try{await api('/setup/configure',{method:'POST',body:{nasIp,romPath}});}
    catch(e){setErr(String(e));}
    finally{setSaving(false);}
  };

  const scan = async()=>{
    setScanning(true); setScan(null); setErr(null);
    try{const r=await api('/roms/scan',{method:'POST'});setScan(r);}
    catch(e){setErr(String(e));}
    finally{setScanning(false);}
  };

  const field = (label,value,onChange,hint,placeholder) => (
    <div style={{marginBottom:16}}>
      <label>{label}</label>
      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||''}/>
      {hint && <div style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)',marginTop:5,lineHeight:1.5}}>{hint}</div>}
    </div>
  );

  const box = (title,children) => (
    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:'18px 20px',marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--muted)',marginBottom:14}}>{title}</div>
      {children}
    </div>
  );

  return (
    <div style={{flex:1,padding:'22px 24px',maxWidth:800,margin:'0 auto',width:'100%'}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:22,fontWeight:700,marginBottom:6}}>Setup CyanGame</div>
        <div style={{fontSize:13,color:'var(--muted)'}}>Configure your server and scan your ROM library.</div>
      </div>
      {err && <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',borderRadius:9,padding:'12px 14px',fontSize:12,fontFamily:'var(--mono)',color:'var(--red)',marginBottom:14}}>✗ {err}</div>}

      {box('Server Configuration', <>
        {field('NAS / Unraid IP', nasIp, setNasIp, 'IP of the machine running this Docker stack', '192.168.1.100')}
        {field('ROM Folder Path', romPath, setRomPath, 'Organize as: /mnt/user/roms/snes/game.sfc  ·  /mnt/user/roms/ps2/game.iso', '/mnt/user/roms')}
        <button onClick={save} disabled={saving} style={{
          background:'var(--cyan)',color:'#000',borderRadius:8,padding:'9px 18px',fontSize:12,
          fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase',display:'inline-flex',alignItems:'center',gap:7}}>
          {saving?<><Spinner/>Saving…</>:'✓ Save Config'}
        </button>
      </>)}

      {box('ROM Library', <>
        <div style={{fontSize:12,fontFamily:'var(--mono)',color:'var(--muted)',marginBottom:14,lineHeight:1.7}}>
          Put ROMs in system-named subfolders inside your ROM path:<br/>
          <span style={{color:'var(--cyan)'}}>{romPath}/nes/</span> &nbsp;·&nbsp;
          <span style={{color:'var(--cyan)'}}>{romPath}/snes/</span> &nbsp;·&nbsp;
          <span style={{color:'var(--cyan)'}}>{romPath}/ps2/</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={scan} disabled={scanning} style={{
            background:'var(--purple)',color:'#fff',borderRadius:8,padding:'9px 18px',fontSize:12,
            fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase',display:'inline-flex',alignItems:'center',gap:7}}>
            {scanning?<><Spinner/>Scanning…</>:'⟳ Scan ROM Folder'}
          </button>
          {scanResult && <span style={{fontSize:12,fontFamily:'var(--mono)',color:'var(--green)'}}>✓ {scanResult.added} new ROMs added</span>}
        </div>
      </>)}

      {box('Supported Systems',
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',gap:8}}>
          {Object.entries(SYS).map(([k,v])=>(
            <div key={k} style={{padding:'8px 10px',background:'var(--bg3)',borderRadius:7,
              fontSize:12,display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:v.color,flexShrink:0}}/>
              {v.name}
            </div>
          ))}
        </div>
      )}

      <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
        <button onClick={onDone} style={{background:'var(--cyan)',color:'#000',borderRadius:8,
          padding:'10px 20px',fontSize:12,fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase'}}>
          Go to Library →
        </button>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('library');
  const [roms, setRoms] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [playRom, setPlayRom] = useState(null);
  const [stream, setStream] = useState(null);
  const { toasts, toast } = useToast();

  const load = useCallback(async()=>{
    try {
      const [r,s] = await Promise.all([api('/roms'), api('/sessions')]);
      setRoms(r); setSessions(s);
    } catch(e){ console.error(e); }
  },[]);

  useEffect(()=>{load();},[load]);

  useEffect(()=>{
    const ws = new WebSocket(`ws://${location.host}/ws?type=portal`);
    ws.onmessage = ()=>load();
    ws.onerror = ()=>{};
    return()=>ws.close();
  },[load]);

  const systems = [...new Set(roms.map(r=>r.system))].sort();
  const filtered = roms.filter(r=>{
    if(filter!=='all'&&r.system!==filter)return false;
    if(search&&!r.title.toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  });
  const getSession = romId => sessions.find(s=>s.rom_id===romId);

  const handlePlay = async(rom)=>{
    const sess = await api('/sessions',{method:'POST',body:{romId:rom.id,mode:'emulation_server'}});
    setPlayRom(null);
    setStream({rom,session:sess});
    toast(`Launching ${rom.title}…`,'info');
    setTimeout(load, 1000);
  };

  const handleStop = async()=>{
    if(stream?.session?.sessionId){
      await api(`/sessions/${stream.session.sessionId}`,{method:'DELETE'}).catch(()=>{});
    }
    toast('Session ended','info');
    load();
  };

  const btn = (label,col='var(--cyan)',bg=undefined) => ({
    background:bg||col,color:bg?col:'#000',borderRadius:8,padding:'9px 16px',
    fontSize:12,fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase',
    display:'inline-flex',alignItems:'center',gap:7,
    border:bg?`1px solid ${col}`:'none',cursor:'pointer',
  });

  return (
    <>
      <style>{`
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        @keyframes spin{to{transform:rotate(360deg)}}
      `}</style>

      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
        {/* Topbar */}
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'0 20px',height:54,
          borderBottom:'1px solid var(--border)',background:'var(--bg)',position:'sticky',top:0,zIndex:100}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:26,height:26,background:'var(--cyan)',
              clipPath:'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)'}}/>
            <span style={{fontSize:14,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase'}}>CyanGame</span>
            <span style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--muted)',
              background:'var(--bg3)',padding:'2px 6px',borderRadius:3}}>v0.2</span>
          </div>

          <div style={{display:'flex',gap:2,marginLeft:12}}>
            {[['library','Library'],['setup','Setup']].map(([v,l])=>(
              <button key={v} onClick={()=>setView(v)} style={{
                background:view===v?'rgba(34,211,238,.08)':'none',
                border:'none',cursor:'pointer',fontFamily:'var(--font)',fontSize:12,
                fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',
                color:view===v?'var(--cyan)':'var(--muted)',padding:'6px 12px',borderRadius:6}}>
                {l}
              </button>
            ))}
          </div>

          <div style={{display:'flex',alignItems:'center',gap:10,marginLeft:'auto'}}>
            {view==='library' && (
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
                  color:'var(--muted)',fontSize:13,pointerEvents:'none'}}>⌕</span>
                <input style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                  padding:'7px 12px 7px 30px',fontFamily:'var(--font)',fontSize:13,color:'var(--text)',
                  width:200,outline:'none'}}
                  placeholder="Search ROMs…" value={search} onChange={e=>setSearch(e.target.value)}/>
              </div>
            )}
            {view==='library' && (
              <button onClick={()=>api('/roms/scan',{method:'POST'})
                .then(r=>{toast(`${r.added} ROMs found`,'ok');load();})
                .catch(e=>toast(String(e),'err'))}
                style={{...btn('','var(--purple)','rgba(168,85,247,.1)'),fontSize:11,padding:'6px 12px',borderRadius:7}}>
                ⟳ Scan ROMs
              </button>
            )}
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',
              background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,
              fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}}>
              <Dot status="on"/>
              {roms.length} ROMs
            </div>
            {sessions.length>0 && (
              <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',
                background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:20,
                fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}}>
                <Dot status="live"/>
                {sessions.length} live
              </div>
            )}
          </div>
        </div>

        {/* Setup view */}
        {view==='setup' && <SetupView onDone={()=>{setView('library');load();}}/>}

        {/* Library view */}
        {view==='library' && (
          <div style={{flex:1,padding:'22px 24px',maxWidth:1440,margin:'0 auto',width:'100%'}}>
            {/* System filter chips */}
            <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:20,flexWrap:'wrap'}}>
              <span style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--muted)',
                textTransform:'uppercase',letterSpacing:'.1em',marginRight:4}}>System</span>
              <div onClick={()=>setFilter('all')} style={{
                display:'flex',alignItems:'center',gap:6,padding:'5px 12px',
                background:filter==='all'?'rgba(168,85,247,.1)':'var(--bg3)',
                border:`1px solid ${filter==='all'?'rgba(168,85,247,.3)':'var(--border)'}`,
                borderRadius:20,cursor:'pointer',fontSize:12,fontWeight:500,
                color:filter==='all'?'var(--purple)':'var(--muted)',transition:'all .15s'}}>
                All <span style={{fontSize:10,fontFamily:'var(--mono)',background:'rgba(0,0,0,.3)',padding:'1px 5px',borderRadius:3}}>{roms.length}</span>
              </div>
              {systems.map(sys=>{
                const cnt=roms.filter(r=>r.system===sys).length;
                const s=SYS[sys]||{name:sys,color:'#333'};
                const active=filter===sys;
                return (
                  <div key={sys} onClick={()=>setFilter(sys)} style={{
                    display:'flex',alignItems:'center',gap:6,padding:'5px 12px',
                    background:active?s.color+'22':'var(--bg3)',
                    border:`1px solid ${active?s.color+'55':'var(--border)'}`,
                    borderRadius:20,cursor:'pointer',fontSize:12,fontWeight:500,
                    color:active?s.color:'var(--muted)',transition:'all .15s'}}>
                    {s.name}
                    <span style={{fontSize:10,fontFamily:'var(--mono)',background:'rgba(0,0,0,.3)',padding:'1px 5px',borderRadius:3}}>{cnt}</span>
                  </div>
                );
              })}
            </div>

            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
              <span style={{fontSize:12,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--muted)'}}>
                {filter==='all'?'All ROMs':SYS[filter]?.name||filter}
              </span>
              <span style={{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)',opacity:.5}}>
                {filtered.length} titles
              </span>
            </div>

            {filtered.length>0 ? (
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:11}}>
                {filtered.map(rom=>(
                  <RomCard key={rom.id} rom={rom} inSession={!!getSession(rom.id)} onPlay={setPlayRom}/>
                ))}
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                gap:10,padding:'80px 20px',color:'var(--muted)'}}>
                <div style={{fontSize:32,opacity:.4}}>💾</div>
                <div style={{fontSize:12,fontFamily:'var(--mono)'}}>
                  {search ? 'no ROMs match your search' : 'No ROMs found — go to Setup and scan your ROM folder'}
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Play modal */}
      {playRom && <PlayModal rom={playRom} inSession={!!getSession(playRom.id)} onLaunch={handlePlay} onClose={()=>setPlayRom(null)}/>}

      {/* Stream viewer */}
      {stream && <StreamViewer rom={stream.rom} session={stream.session} onStop={handleStop} onClose={()=>setStream(null)}/>}

      {/* Toasts */}
      <div style={{position:'fixed',bottom:24,right:24,zIndex:500,display:'flex',flexDirection:'column',gap:8}}>
        {toasts.map(t=>(
          <div key={t.id} style={{
            padding:'12px 16px',borderRadius:9,fontSize:12,fontFamily:'var(--mono)',
            maxWidth:300,display:'flex',alignItems:'center',gap:8,
            background:t.type==='ok'?'#052e16':t.type==='err'?'#2d0a0a':'var(--bg3)',
            border:t.type==='ok'?'1px solid rgba(16,185,129,.3)':t.type==='err'?'1px solid rgba(239,68,68,.3)':'1px solid var(--border2)',
            color:t.type==='ok'?'var(--green)':t.type==='err'?'var(--red)':'var(--text)',
          }}>
            {t.type==='ok'?'✓':t.type==='err'?'✗':'·'} {t.msg}
          </div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
