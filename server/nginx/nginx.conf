events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:3001;
  }

  upstream mediamtx_webrtc {
    server mediamtx:8889;
  }

  server {
    listen 80;
    server_name _;

    # ── Portal API ─────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
    }

    # ── WebSocket (node heartbeats, session events) ────────────────
    location /ws {
      proxy_pass http://backend/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # ── WebRTC streams (browser pulls console stream) ──────────────
    location /stream/ {
      proxy_pass http://mediamtx_webrtc/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Allow large SDP payloads
      client_max_body_size 10m;
    }

    # ── Frontend static files ──────────────────────────────────────
    location / {
      proxy_pass http://backend/ui/;
      proxy_set_header Host $host;
    }
  }
}
